services:
  # Public site + admin SPA (static frontend).
  - type: web
    name: nexsate
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: starter
    autoDeploy: true
    envVars:
      # Replace the value below with the URL of your nexsate-api service
      # after it is created, e.g. https://nexsafe-api.onrender.com
      - key: VITE_API_URL
        value: https://nexsafe-api.onrender.com
      - key: NODE_ENV
        value: production

  # PHP + SQLite API for content, media, auth, and messages.
  - type: web
    name: nexsate-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: starter
    healthCheckPath: /api/content.php
    autoDeploy: true
    envVars:
      - key: NX_DATA_DIR
        value: /data/db
      - key: NX_UPLOAD_DIR
        value: /data/uploads
      - key: NX_UPLOAD_URL
        value: /uploads
      - key: NX_SITE_BASE
        value: /
    disk:
      name: nexsate-data
      mountPath: /data
      sizeGB: 1
